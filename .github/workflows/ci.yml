name: Testing

on:
  push:
  pull_request:

jobs:
  test_project:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django

      - name: Run Django tests
        run: python manage.py test
